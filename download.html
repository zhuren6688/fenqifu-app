<!DOCTYPE html>
<html lang="zh-CN">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>下载分期付 APP</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f5f7fa;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Microsoft YaHei",
        Arial,
        sans-serif;
    color: #222;
}

.container {
    min-height: 100vh;
    padding: 25px 18px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 100%;
    max-width: 430px;
    background: white;
    border-radius: 22px;
    padding: 38px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

.logo {
    width: 88px;
    height: 88px;
    margin: 0 auto 18px;
    border-radius: 20px;
    background: #1677ff;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
    font-weight: bold;
}

h1 {
    margin: 0 0 10px;
    font-size: 27px;
}

.version {
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}

/* 微信提示 */
.wechat-box {
    display: none;
    background: #fff7e6;
    border: 1px solid #ffd591;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 20px;
    text-align: left;
}

.wechat-title {
    color: #d46b08;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 8px;
}

.wechat-text {
    color: #666;
    font-size: 14px;
    line-height: 1.8;
}

/* 下载按钮 */

.download {
    display: block;
    width: 100%;
    padding: 16px;
    background: #1677ff;
    color: white;
    text-decoration: none;
    border-radius: 13px;
    font-size: 18px;
    font-weight: bold;
}

.download:active {
    opacity: 0.8;
}

.info {
    margin-top: 22px;
    background: #f5f7fa;
    border-radius: 12px;
    padding: 16px;
    color: #777;
    font-size: 13px;
    line-height: 1.8;
}

.back {
    display: block;
    margin-top: 20px;
    color: #1677ff;
    text-decoration: none;
    font-size: 14px;
}

.footer {
    margin-top: 25px;
    padding-top: 20px;
    border-top: 1px solid #eee;
    color: #999;
    font-size: 13px;
}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="logo">
            分
        </div>

        <h1>
            下载分期付 APP
        </h1>

        <div class="version">
            Android 安卓版 · v1.0.0
        </div>


        <!-- 微信环境 -->

        <div class="wechat-box" id="wechatBox">

            <div class="wechat-title">
                微信内请先打开浏览器
            </div>

            <div class="wechat-text">

                请点击微信右上角
                <b>“···”</b>

                <br>

                选择
                <b>“在浏览器中打开”</b>

                <br>

                打开后再点击下面的下载按钮。

            </div>

        </div>


        <!-- 真正的 APK 下载地址 -->

        <a
            class="download"
            id="downloadButton"
            href="https://github.com/zhuren6688/fenqifu-app/raw/refs/heads/main/%E5%88%86%E6%9C%9F%E4%BB%98.apk">

            下载 APP

        </a>


        <div class="info">

            APP 名称：分期付

            <br>

            系统：Android

            <br>

            版本：v1.0.0

            <br>

            下载后请按照手机提示完成安装

        </div>


        <a
            class="back"
            href="index.html">

            ← 返回下载首页

        </a>


        <div class="footer">

            分期付 APP

        </div>

    </div>

</div>


<script>

/* 判断微信 */

var ua = navigator.userAgent.toLowerCase();

var isWeChat =
    ua.indexOf("micromessenger") !== -1;


/* 如果是微信 */

if (isWeChat) {

    document.getElementById("wechatBox")
        .style.display = "block";


    /*
     * 微信环境阻止直接下载，
     * 提示用户使用浏览器。
     */

    document.getElementById("downloadButton")
        .onclick = function(e) {

            e.preventDefault();

            alert(
                "请先点击微信右上角“···”，\n" +
                "选择“在浏览器中打开”，\n" +
                "然后点击“下载 APP”。"
            );

        };

}

</script>

</body>
</html>
